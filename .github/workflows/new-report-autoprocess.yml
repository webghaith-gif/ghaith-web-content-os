name: New Report Auto Process

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/new-report-autoprocess.yml'
      - 'src/server.ts'
      - 'src/services/drive-report-ingestion.service.ts'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: new-report-autoprocess
  cancel-in-progress: false

jobs:
  process-new-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Advance newest report through the resumable review pipeline
        shell: bash
        run: |
          set -u
          base='https://ghaith-web-content-os.vercel.app'

          # A push may arrive before Vercel has promoted the new production build.
          if [ "${{ github.event_name }}" = "push" ]; then
            sleep 55
          fi

          # Each call first polls Drive changes, then advances exactly one durable stage.
          # Repeating the call is safe: completed stages are detected from persisted state.
          # Operational retest marker: 2026-08-22 report intake verification.
          for step in 1 2 3 4 5 6; do
            response_file=$(mktemp)
            status=$(curl -sS --max-time 300 -o "$response_file" -w '%{http_code}' \
              -X POST "$base/api/automation/process-next-stage")

            echo "Automation step $step -> HTTP $status"
            cat "$response_file" | jq '{ok,idle,reportId,stage,message,contentId,productId,driveImport}' 2>/dev/null || cat "$response_file"

            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo 'Stage deferred. The app recorded the interruption and the next scheduled run will retry safely.'
              exit 0
            fi

            idle=$(jq -r '.idle // false' "$response_file")
            stage=$(jq -r '.stage // empty' "$response_file")
            if [ "$idle" = 'true' ]; then
              echo 'No pending reports.'
              exit 0
            fi
            if [ "$stage" = 'PIPELINE_COMPLETE' ]; then
              echo 'Report pipeline complete. Human review remains the next gate; nothing was sent READY or published.'
              exit 0
            fi

            sleep 2
          done

          echo 'Run time-box reached before completion. The next 5-minute run will resume from the first incomplete stage.'
