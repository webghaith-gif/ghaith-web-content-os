name: New Report Auto Process

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/new-report-autoprocess.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: new-report-autoprocess
  cancel-in-progress: false

jobs:
  process-new-report:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Process newest pending report to high-quality IN_REVIEW content
        shell: bash
        run: |
          set -euo pipefail
          base='https://ghaith-web-content-os.vercel.app'

          reports=$(curl -fsS --max-time 60 "$base/api/reports")
          opportunities=$(curl -fsS --max-time 60 "$base/api/opportunities")
          contents=$(curl -fsS --max-time 60 "$base/api/content")

          # Historical Gmail summaries are handled by the slow backfill workflow.
          # This workflow prioritizes every normal/new report as soon as it appears.
          report_id=$(jq -nr \
            --argjson reports "$reports" \
            --argjson contents "$contents" '
              [$reports[]
                | select(((.source // "") | startswith("Historical Gmail report summary")) | not)
                | select(.id as $rid | ([ $contents[] | select(.sourceReportId == $rid) ] | length) == 0)
              ]
              | sort_by(.createdAt)
              | reverse
              | .[0].id // empty
            ')

          if [ -z "$report_id" ]; then
            echo 'No pending new reports.'
            exit 0
          fi

          report_title=$(echo "$reports" | jq -r --arg id "$report_id" '.[] | select(.id==$id) | .title')
          echo "Processing new report: $report_title ($report_id)"

          opportunity_id=$(echo "$opportunities" | jq -r --arg rid "$report_id" '
            [.[] | select(.reportId==$rid)] | sort_by(.score.total) | reverse | .[0].id // empty
          ')

          if [ -z "$opportunity_id" ]; then
            response_file=$(mktemp)
            status=$(curl -sS --max-time 180 -o "$response_file" -w '%{http_code}' \
              -X POST "$base/api/reports/$report_id/opportunities")
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "Opportunity extraction deferred with HTTP $status; next 5-minute run will retry."
              cat "$response_file"
              exit 0
            fi
            opportunity_id=$(jq -r 'sort_by(.score.total) | reverse | .[0].id // empty' "$response_file")
          fi

          if [ -z "$opportunity_id" ]; then
            echo 'No opportunity produced; leaving report pending.'
            exit 0
          fi

          response_file=$(mktemp)
          status=$(curl -sS --max-time 180 -o "$response_file" -w '%{http_code}' \
            -X POST "$base/api/opportunities/$opportunity_id/content" \
            -H 'Content-Type: application/json' \
            -d '{"platforms":["facebook","instagram","tiktok","pinterest","youtube"]}')

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Content generation deferred with HTTP $status; next 5-minute run will retry."
            cat "$response_file"
            exit 0
          fi

          jq '{id,title,status,sourceReportId,platforms,qualityReview:.package.qualityReview,platformCopies:(.package.platformCopies|keys)}' "$response_file"
          test "$(jq -r '.status' "$response_file")" = 'IN_REVIEW'

          echo 'New report processed. Content is IN_REVIEW; nothing was published or sent READY.'
