name: Google Drive Production Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-drive-production-smoke.yml'

permissions:
  contents: read
  statuses: write
  issues: write

jobs:
  drive-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production rollout
        run: sleep 30
      - name: Probe Google Drive production integration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status_url='https://ghaith-web-content-os.vercel.app/api/integrations/google-drive/status'
          test_url='https://ghaith-web-content-os.vercel.app/api/integrations/google-drive/test'
          status_body="$(curl -sS "$status_url" || true)"
          test_body="$(curl -sS "$test_url" || true)"
          echo "STATUS: $status_body"
          echo "TEST: $test_body"

          state='error'
          description='Google Drive production integration not ready'
          if printf '%s' "$test_body" | grep -q '"ok":true'; then
            state='success'
            description='Google Drive production integration verified'
          fi

          payload=$(printf '{"state":"%s","context":"google-drive-production-smoke","description":"%s"}' "$state" "$description")
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

          if [ "$state" != 'success' ]; then
            safe_status="$(printf '%s' "$status_body" | tr '\n\r' ' ' | sed -E 's/(access[_-]?token|refresh[_-]?token|api[_-]?key|client[_-]?secret|authorization|bearer)[^,}]*/\1=[REDACTED]/Ig' | cut -c1-700)"
            safe_test="$(printf '%s' "$test_body" | tr '\n\r' ' ' | sed -E 's/(access[_-]?token|refresh[_-]?token|api[_-]?key|client[_-]?secret|authorization|bearer)[^,}]*/\1=[REDACTED]/Ig' | cut -c1-700)"
            comment=$(jq -n --arg body "GOOGLE_DRIVE_PRODUCTION_DIAGNOSTIC\nSTATUS: ${safe_status}\nTEST: ${safe_test}" '{body:$body}')
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/29/comments" \
              -d "$comment" >/dev/null
          fi

          test "$state" = 'success'
