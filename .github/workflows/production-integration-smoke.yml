name: Production Integration Smoke

on:
  push:
    branches: [main]
    paths:
      - 'src/integrations/openai.adapter.ts'
      - 'src/config/env.ts'
      - '.github/workflows/production-integration-smoke.yml'

permissions:
  contents: read
  statuses: write
  issues: write

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production rollout
        run: sleep 10

      - name: Verify GPT integration in production
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint='https://ghaith-web-content-os.vercel.app/api/integrations/openai/test'
          body=''
          ok='false'
          for attempt in {1..3}; do
            body="$(curl -sS "$endpoint" 2>/dev/null || true)"
            echo "Attempt $attempt: $body"
            if printf '%s' "$body" | grep -q '"ok":true'; then
              ok='true'
              break
            fi
            sleep 5
          done

          state='error'
          description='GPT production integration failed'
          if [ "$ok" = 'true' ]; then
            state='success'
            description='GPT production integration verified'
          else
            safe="$(printf '%s' "$body" \
              | tr '\n\r' '  ' \
              | sed -E 's/(access[_-]?token|refresh[_-]?token|api[_-]?key|client[_-]?secret|authorization|bearer)[^,}]*/\1=[REDACTED]/Ig' \
              | cut -c1-900)"
            short="$(printf '%s' "$safe" | sed 's/["\\]/ /g' | cut -c1-90)"
            description="GPT failed: ${short}"

            comment=$(jq -n --arg body "GPT_PRODUCTION_SMOKE_DIAGNOSTIC\nCommit: ${GITHUB_SHA}\n${safe}" '{body:$body}')
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/29/comments" \
              -d "$comment" >/dev/null
          fi

          description="$(printf '%s' "$description" | cut -c1-120)"
          payload=$(printf '{"state":"%s","context":"gpt-production-smoke","description":"%s"}' "$state" "$description")
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

          test "$ok" = 'true'
