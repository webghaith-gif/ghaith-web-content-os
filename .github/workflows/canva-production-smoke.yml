name: Canva Production Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canva-production-smoke.yml'

permissions:
  contents: read
  statuses: write

jobs:
  canva-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production rollout
        run: sleep 35
      - name: Verify Canva OAuth, API access, and real master-design generation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          post_status() {
            local context="$1"
            local state="$2"
            local description="$3"
            local payload
            payload=$(printf '{"state":"%s","context":"%s","description":"%s"}' "$state" "$context" "$description")
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "$payload" >/dev/null
          }

          connection_state="error"
          for i in {1..12}; do
            body="$(curl -fsS "https://ghaith-web-content-os.vercel.app/api/integrations/canva/test" 2>/dev/null || true)"
            echo "Connection attempt $i: $body"
            if printf '%s' "$body" | grep -q '"ok":true'; then
              connection_state="success"
              break
            fi
            sleep 5
          done

          if [ "$connection_state" = "success" ]; then
            post_status "canva-production-smoke" "success" "Canva OAuth and API access verified"
          else
            post_status "canva-production-smoke" "error" "Canva OAuth/API smoke failed"
            exit 1
          fi

          asset_state="error"
          for i in {1..6}; do
            asset_body="$(curl -fsS -X POST "https://ghaith-web-content-os.vercel.app/api/content/canva-smoke-20260819-0830/assets" 2>/dev/null || true)"
            echo "Asset attempt $i: $asset_body"
            if printf '%s' "$asset_body" | grep -q '"provider":"canva"'; then
              asset_state="success"
              break
            fi
            sleep 5
          done

          if [ "$asset_state" = "success" ]; then
            post_status "canva-asset-smoke" "success" "Canva master design created and exported"
          else
            post_status "canva-asset-smoke" "error" "Canva asset generation smoke failed"
            exit 1
          fi
