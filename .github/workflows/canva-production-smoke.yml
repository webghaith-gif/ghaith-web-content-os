name: Canva Production Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canva-production-smoke.yml'

permissions:
  contents: read
  statuses: write

jobs:
  canva-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production rollout
        run: sleep 35
      - name: Verify Canva OAuth and API access
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://ghaith-web-content-os.vercel.app/api/integrations/canva/test"
          state="error"
          description="Canva production smoke failed"
          for i in {1..12}; do
            body="$(curl -fsS "$url" 2>/dev/null || true)"
            echo "Attempt $i: $body"
            if printf '%s' "$body" | grep -q '"ok":true'; then
              state="success"
              description="Canva OAuth and API access verified"
              break
            fi
            sleep 5
          done

          payload=$(printf '{"state":"%s","context":"canva-production-smoke","description":"%s"}' "$state" "$description")
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"

          test "$state" = "success"
