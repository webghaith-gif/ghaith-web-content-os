name: Canva Production Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canva-production-smoke.yml'

permissions:
  contents: read
  statuses: write

jobs:
  canva-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production rollout
        run: sleep 35
      - name: Verify Canva OAuth, capabilities, and asset path
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          post_status() {
            local context="$1"
            local state="$2"
            local description="$3"
            local payload
            description="$(printf '%s' "$description" | tr '\n\r' '  ' | sed 's/["\\]/ /g' | cut -c1-120)"
            payload=$(printf '{"state":"%s","context":"%s","description":"%s"}' "$state" "$context" "$description")
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "$payload" >/dev/null
          }

          probe=""
          for i in {1..12}; do
            probe="$(curl -fsS "https://ghaith-web-content-os.vercel.app/api/integrations/canva/test" 2>/dev/null || true)"
            echo "Connection attempt $i: $probe"
            if printf '%s' "$probe" | grep -q '"ok":true'; then
              break
            fi
            sleep 5
          done

          if ! printf '%s' "$probe" | grep -q '"ok":true'; then
            post_status "canva-production-smoke" "error" "Canva OAuth/API smoke failed"
            exit 1
          fi
          post_status "canva-production-smoke" "success" "Canva OAuth and API access verified"

          if printf '%s' "$probe" | grep -q '"autofillCapable":true'; then
            post_status "canva-autofill-capability" "success" "Connected Canva account has autofill capability"
          else
            post_status "canva-autofill-capability" "error" "Connected Canva account does not have autofill capability"
            exit 0
          fi

          raw="$(curl -sS -X POST -w '\nHTTP_STATUS:%{http_code}' "https://ghaith-web-content-os.vercel.app/api/content/canva-smoke-20260819-0830/assets" || true)"
          asset_body="$(printf '%s\n' "$raw" | sed '$d')"
          if printf '%s' "$asset_body" | grep -q '"provider":"canva"'; then
            post_status "canva-asset-smoke" "success" "Canva master design created and exported"
            exit 0
          fi
          post_status "canva-asset-smoke" "error" "Canva asset generation failed despite autofill capability"
          exit 1
