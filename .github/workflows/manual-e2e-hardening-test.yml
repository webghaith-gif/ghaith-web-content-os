name: Manual E2E Hardening Test

on:
  push:
    branches: [hardening-e2e-20260821]
    paths:
      - '.github/workflows/manual-e2e-hardening-test.yml'
      - '.hardening/e2e-trigger.txt'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run production workflow through ClickUp READY
        shell: bash
        run: |
          set -euo pipefail
          base='https://ghaith-web-content-os.vercel.app'

          report_payload='{"title":"[E2E TEST] Ghaith Web Content OS — 21 Aug 2026","source":"Hardening Test","body":"اختبار تقني داخلي لمنظومة Ghaith Web Content OS. الهدف الوحيد هو التحقق من المسار: تقرير ثم فرصة ثم محتوى تعليمي غير ترويجي ثم أصول ثم مراجعة ثم READY ثم ClickUp ثم Make. يجب أن يكون المحتوى واضحًا بأنه اختبار تقني فقط، بلا بيع، بلا عروض، بلا أسعار، وبلا ادعاءات عن منتج."}'
          report="$(curl --retry 3 --retry-all-errors -fsS -X POST "$base/api/reports" -H 'Content-Type: application/json' --data "$report_payload")"
          report_id="$(printf '%s' "$report" | jq -r '.id')"
          echo "REPORT_ID=$report_id"
          test -n "$report_id" && test "$report_id" != null

          opportunities="$(curl --retry 3 --retry-all-errors -fsS -X POST "$base/api/reports/$report_id/opportunities")"
          opportunity_id="$(printf '%s' "$opportunities" | jq -r '.[0].id')"
          echo "OPPORTUNITY_ID=$opportunity_id"
          test -n "$opportunity_id" && test "$opportunity_id" != null

          content="$(curl --retry 2 --retry-all-errors -fsS -X POST "$base/api/opportunities/$opportunity_id/content" -H 'Content-Type: application/json' --data '{"platforms":["tiktok"]}')"
          content_id="$(printf '%s' "$content" | jq -r '.id')"
          echo "CONTENT_ID=$content_id"
          test -n "$content_id" && test "$content_id" != null

          status="$(printf '%s' "$content" | jq -r '.status')"
          test "$status" = 'IN_REVIEW'

          asset_count="$(printf '%s' "$content" | jq '[.assets[]?] | length')"
          if [ "$asset_count" -eq 0 ]; then
            echo 'Automatic assets were empty; retrying asset generation once.'
            content="$(curl --retry 2 --retry-all-errors -fsS -X POST "$base/api/content/$content_id/assets")"
            asset_count="$(printf '%s' "$content" | jq '[.assets[]?] | length')"
          fi
          echo "ASSET_COUNT=$asset_count"
          test "$asset_count" -gt 0

          approved="$(curl --retry 3 --retry-all-errors -fsS -X POST "$base/api/content/$content_id/approve" -H 'Content-Type: application/json' --data '{"approvedBy":"Hardening E2E Test"}')"
          test "$(printf '%s' "$approved" | jq -r '.status')" = 'READY'

          dispatched="$(curl --retry 3 --retry-all-errors -fsS -X POST "$base/api/content/$content_id/publish")"
          printf '%s\n' "$dispatched" | jq .
          test "$(printf '%s' "$dispatched" | jq -r '.dispatched')" = 'true'
          task_id="$(printf '%s' "$dispatched" | jq -r '.tasks[] | select(.platform=="tiktok") | .taskId')"
          echo "CLICKUP_TASK_ID=$task_id"
          test -n "$task_id" && test "$task_id" != null

          echo 'Waiting briefly for Make Watch Tasks to process the READY task.'
          for attempt in 1 2 3 4 5; do
            sleep 60
            current="$(curl --retry 2 --retry-all-errors -fsS "$base/api/content/$content_id")"
            current_status="$(printf '%s' "$current" | jq -r '.status')"
            echo "POLL_$attempt status=$current_status"
            if [ "$current_status" = 'PUBLISHED' ]; then
              echo 'E2E_RESULT=PUBLISHED'
              exit 0
            fi
          done

          echo 'E2E_RESULT=DISPATCHED_WAITING_FOR_MAKE'
          exit 0
