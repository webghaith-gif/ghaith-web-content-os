name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ghaith
          POSTGRES_PASSWORD: ghaith_test
          POSTGRES_DB: ghaith_web_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghaith -d ghaith_web_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://ghaith:ghaith_test@127.0.0.1:5432/ghaith_web_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm test
