name: Historical Report Backfill

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical-report-backfill.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-report-backfill
  cancel-in-progress: false

jobs:
  process-one-report:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Process one historical report safely
        shell: bash
        run: |
          set -euo pipefail
          base='https://ghaith-web-content-os.vercel.app'

          reports=$(curl -fsS --max-time 60 "$base/api/reports")
          opportunities=$(curl -fsS --max-time 60 "$base/api/opportunities")
          contents=$(curl -fsS --max-time 60 "$base/api/content")

          report_id=$(jq -nr \
            --argjson reports "$reports" \
            --argjson contents "$contents" '
              [$reports[]
                | select((.source // "") | startswith("Historical Gmail report summary"))
                | select(.id as $rid | ([ $contents[] | select(.sourceReportId == $rid) ] | length) == 0)
              ]
              | sort_by(.createdAt)
              | reverse
              | .[0].id // empty
            ')

          if [ -z "$report_id" ]; then
            echo 'No pending historical reports. Backfill is complete.'
            exit 0
          fi

          report_title=$(echo "$reports" | jq -r --arg id "$report_id" '.[] | select(.id==$id) | .title')
          echo "Processing: $report_title ($report_id)"

          opportunity_id=$(echo "$opportunities" | jq -r --arg rid "$report_id" '
            [.[] | select(.reportId==$rid)] | sort_by(.score.total) | reverse | .[0].id // empty
          ')

          if [ -z "$opportunity_id" ]; then
            echo 'Extracting opportunities...'
            response_file=$(mktemp)
            status=$(curl -sS --max-time 180 -o "$response_file" -w '%{http_code}' \
              -X POST "$base/api/reports/$report_id/opportunities")
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "Opportunity extraction paused with HTTP $status. It will retry on the next scheduled run."
              cat "$response_file"
              exit 0
            fi
            opportunity_id=$(jq -r 'sort_by(.score.total) | reverse | .[0].id // empty' "$response_file")
          fi

          if [ -z "$opportunity_id" ]; then
            echo 'No opportunity was produced; leaving report pending for review.'
            exit 0
          fi

          echo "Generating one multi-platform package from best opportunity: $opportunity_id"
          response_file=$(mktemp)
          status=$(curl -sS --max-time 180 -o "$response_file" -w '%{http_code}' \
            -X POST "$base/api/opportunities/$opportunity_id/content" \
            -H 'Content-Type: application/json' \
            -d '{"platforms":["facebook","instagram","tiktok","pinterest","youtube","x"]}')

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Content generation paused with HTTP $status. It will retry on the next scheduled run."
            cat "$response_file"
            exit 0
          fi

          jq '{id,title,status,sourceReportId,platforms}' "$response_file"
          echo 'Historical report processed to IN_REVIEW. No assets, ClickUp handoff, or publishing were triggered.'
