name: DarsKit UI Kit type inspection
on:
  push:
    branches: [darskit-canva-review-fix]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          mkdir -p /tmp/canva-types && cd /tmp/canva-types
          npm init -y >/dev/null
          npm install --silent @canva/app-ui-kit@5.14.1 @canva/design@2.13.0
          echo '=== PUBLIC FileInput type ==='
          cat node_modules/@canva/app-ui-kit/dist/esm/ui/apps/developing/ui_kit/components/form/upload/file_input.d.ts
          echo '=== BASE FileDrop/FileInput types ==='
          cat node_modules/@canva/app-ui-kit/dist/esm/ui/base/form/upload/file_input/private/file_input.d.ts
          cat node_modules/@canva/app-ui-kit/dist/esm/ui/base/form/upload/file_drop/file_drop.d.ts 2>/dev/null || true
          cat node_modules/@canva/app-ui-kit/dist/esm/ui/base/form/upload/file_input/private/file_input_internal.d.ts
          echo '=== addPage exact declaration ==='
          sed -n '260,410p' node_modules/@canva/design/index.d.ts
